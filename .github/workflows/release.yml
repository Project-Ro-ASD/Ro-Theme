name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Fedora 44 release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: fedora:44

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            bash coreutils diffutils dracut findutils grubby gzip grep \
            kf6-kconfig kf6-kpackage kf6-kservice \
            plasma-desktop plasma-workspace plasma-workspace-libs plasma-login-manager \
            plymouth plymouth-plugin-script python3 rpm rpm-build sed tar util-linux

      - name: Validate tag and build RPMs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "${GITHUB_REF_NAME}" == "v${VERSION}" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]

          FEDORA_RELEASE=44 ./tools/dev/build-rpm.sh

          mkdir -p release-rpms
          BINARY_RPM="$(find build/rpmbuild/RPMS -type f -name 'ro-theme-*.noarch.rpm' -print -quit)"
          SRPM="$(find build/rpmbuild/SRPMS -type f -name 'ro-theme-*.src.rpm' -print -quit)"
          test -n "$BINARY_RPM"
          test -n "$SRPM"

          [[ "$(rpm -qp --qf '%{NAME}' "$BINARY_RPM")" == "ro-theme" ]]
          [[ "$(rpm -qp --qf '%{VERSION}' "$BINARY_RPM")" == "${VERSION}" ]]
          [[ "$(rpm -qp --qf '%{ARCH}' "$BINARY_RPM")" == "noarch" ]]
          [[ "$(rpm -qp --qf '%{RELEASE}' "$BINARY_RPM")" == *.fc44 ]]
          [[ "$(rpm -qp --qf '%{RELEASE}' "$SRPM")" == *.fc44 ]]

          cp "$BINARY_RPM" "$SRPM" release-rpms/

      - name: Upload RPM bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-rpms
          path: release-rpms/*.rpm
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish V2 Contract Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download RPM bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-rpms
          path: bundle

      - name: Install RPM query tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Validate exact RPM set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RPMS < <(find bundle -maxdepth 1 -type f -name '*.rpm' -printf '%f\n' | sort)
          [[ "${#RPMS[@]}" -eq 2 ]]
          [[ "$(printf '%s\n' "${RPMS[@]}" | grep -c '\.noarch\.rpm$')" -eq 1 ]]
          [[ "$(printf '%s\n' "${RPMS[@]}" | grep -c '\.src\.rpm$')" -eq 1 ]]

      - name: Create or recover draft release
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name == \"${TAG}\") | [.id,.draft] | @tsv" | head -n1 || true)"
          if [[ -n "$EXISTING" ]]; then
            IFS=$'\t' read -r EXISTING_ID IS_DRAFT <<< "$EXISTING"
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "A published release already exists for ${TAG}; refusing reuse." >&2
              exit 1
            fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${EXISTING_ID}"
          fi

          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true) | .id" | head -n1)"
          test -n "$RELEASE_ID"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Generate strict checksums and component manifest
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          cd bundle
          mapfile -t RPMS < <(find . -maxdepth 1 -type f -name '*.rpm' -printf '%f\n' | sort)
          sha256sum "${RPMS[@]}" > SHA256SUMS

          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess

          root = pathlib.Path('.')
          artifacts = []
          query = '%{NAME}\t%{EPOCHNUM}\t%{VERSION}\t%{RELEASE}\t%{ARCH}\t%{SOURCERPM}\t%|SOURCEPACKAGE?{true}:{false}|'
          for path in sorted(root.glob('*.rpm')):
              values = subprocess.check_output(['rpm','-qp','--qf',query,str(path)], text=True).split('\t')
              if len(values) != 7:
                  raise SystemExit(f'Unexpected RPM header for {path}')
              name, epoch, version, release, arch, source_rpm, is_source = values
              if is_source == 'true':
                  arch = 'src'
                  source_rpm = None
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              artifacts.append({
                  'filename': path.name,
                  'name': name,
                  'epoch': int(epoch or 0),
                  'version': version,
                  'release': release,
                  'architecture': arch,
                  'source_rpm': source_rpm,
                  'producer_artifact_sha256': digest,
              })

          manifest = {
              'schema_version': 1,
              'component': 'ro-theme',
              'source_repository': os.environ['GITHUB_REPOSITORY'],
              'source_commit': os.environ['GITHUB_SHA'],
              'release_tag': os.environ['TAG'],
              'release_id': int(os.environ['RELEASE_ID']),
              'workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'fedora_release': 44,
              'artifacts': artifacts,
              'provenance': {'provider': 'github', 'subject_digest': 'sha256'},
              'attestation': {'provider': 'github', 'verification': 'gh attestation verify'},
          }
          pathlib.Path('component-artifact-manifest-v1.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

          sha256sum -c SHA256SUMS

      - name: Attest exact release bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            bundle/*.rpm
            bundle/SHA256SUMS
            bundle/component-artifact-manifest-v1.json

      - name: Upload complete bundle to draft release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" bundle/*.rpm bundle/SHA256SUMS bundle/component-artifact-manifest-v1.json

      - name: Verify draft assets and publish
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t EXPECTED < <(
            { find bundle -maxdepth 1 -type f -name '*.rpm' -printf '%f\n'; printf '%s\n' SHA256SUMS component-artifact-manifest-v1.json; } | sort
          )
          mapfile -t ACTUAL < <(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq '.[].name' | sort)
          [[ "${#EXPECTED[@]}" -eq 4 ]]
          diff -u <(printf '%s\n' "${EXPECTED[@]}") <(printf '%s\n' "${ACTUAL[@]}")
          gh release edit "$TAG" --draft=false
