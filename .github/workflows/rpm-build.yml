name: Build RPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    name: Fedora RPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Fedora container
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -e GITHUB_REF_NAME \
            -e GITHUB_REF_TYPE \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            fedora:43 \
            bash -lc '
              set -euo pipefail

              dnf install -y --setopt=install_weak_deps=False \
                bash \
                coreutils \
                diffutils \
                findutils \
                gzip \
                grep \
                kf6-kconfig \
                kf6-kpackage \
                kf6-kservice \
                plasma-desktop \
                plasma-workspace \
                plasma-workspace-libs \
                python3 \
                rpm \
                rpm-build \
                sed \
                tar \
                util-linux

              VERSION_VALUE="$(tr -d "[:space:]" < VERSION)"
              if [[ "${GITHUB_REF_TYPE:-}" = "tag" && "${GITHUB_REF_NAME:-}" != "v${VERSION_VALUE}" ]]; then
                echo "Tag ${GITHUB_REF_NAME} does not match VERSION v${VERSION_VALUE}" >&2
                exit 1
              fi

              ./tools/dev/build-rpm.sh
            '

          sudo chown -R "$USER:$USER" build

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ro-theme-rpm-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/rpmbuild/RPMS/**/*.rpm
            build/rpmbuild/SRPMS/**/*.src.rpm
            build/rpmbuild/SOURCES/ro-theme-*.tar.gz
