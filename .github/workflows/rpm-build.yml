name: Build RPM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    name: Fedora RPM
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build in Fedora container
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            fedora:44 \
            bash -lc '
              set -euo pipefail

              dnf install -y --setopt=install_weak_deps=False \
                bash \
                coreutils \
                diffutils \
                dracut \
                findutils \
                grubby \
                gzip \
                grep \
                kf6-kconfig \
                kf6-kpackage \
                kf6-kservice \
                plasma-desktop \
                plasma-workspace \
                plasma-workspace-libs \
                plasma-login-manager \
                plymouth \
                plymouth-plugin-script \
                python3 \
                rpm \
                rpm-build \
                sed \
                tar \
                util-linux

              FEDORA_RELEASE=44 ./tools/dev/build-rpm.sh
            '

          sudo chown -R "$USER:$USER" build

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ro-theme-rpm-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/rpmbuild/RPMS/**/*.rpm
            build/rpmbuild/SRPMS/**/*.src.rpm
